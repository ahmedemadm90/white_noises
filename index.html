<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أصوات الطبيعة للتركيز</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --fg:#fff; --card:rgba(0,0,0,.35); --accent:#7fd4a8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:'Cairo',system-ui,sans-serif; color:var(--fg); background:#0b1a14; }
  #bg { position:fixed; inset:0; z-index:-2; transition:background 1.5s ease; background-size:400% 400% !important; animation:drift 30s ease infinite; }
  #fx { position:fixed; inset:0; z-index:-1; pointer-events:none; }
  @keyframes drift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  main { max-width:900px; margin:0 auto; padding:24px 16px 48px; }
  h1 { text-align:center; margin:8px 0 4px; font-size:clamp(1.6rem,4vw,2.4rem); text-shadow:0 2px 12px rgba(0,0,0,.5); }
  p.sub { text-align:center; opacity:.85; margin:0 0 20px; }
  .top { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center; margin-bottom:20px; }
  button, select { font:inherit; color:var(--fg); background:var(--card); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:8px 18px; cursor:pointer; backdrop-filter:blur(8px); }
  button:hover { background:rgba(255,255,255,.15); }
  #play { font-size:1.2rem; padding:10px 28px; background:var(--accent); color:#0b1a14; font-weight:700; border:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid rgba(255,255,255,.15); border-radius:18px; padding:16px; backdrop-filter:blur(10px); transition:.3s; cursor:pointer; user-select:none; }
  .card.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; }
  .card .ico { font-size:2.2rem; }
  .card .name { font-weight:700; margin:4px 0 10px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .timer { opacity:.9; }
  .window { position:relative; max-width:640px; margin:0 auto 22px; padding:14px; border-radius:14px 14px 8px 8px;
    background:linear-gradient(#6b4a2f,#4a3220); box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.15); }
  .window canvas { display:block; width:100%; aspect-ratio:16/10; border-radius:4px; background:#223; }
  .window::before, .window::after { content:''; position:absolute; background:#5a3e27; box-shadow:0 0 4px rgba(0,0,0,.5); pointer-events:none; }
  .window::before { left:50%; top:14px; bottom:14px; width:8px; transform:translateX(-50%); }
  .window::after { top:50%; left:14px; right:14px; height:8px; transform:translateY(-50%); }
  .sill { position:absolute; left:-18px; right:-18px; bottom:-14px; height:14px; background:#3d2a1a; border-radius:3px; }
  .wlabel { position:absolute; top:22px; right:24px; z-index:2; background:rgba(0,0,0,.45); padding:2px 12px; border-radius:999px; font-size:.9rem; }
  footer { text-align:center; opacity:.6; font-size:.85rem; margin-top:28px; }
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="fx"></canvas>
<main>
  <h1>🌿 أصوات الطبيعة للتركيز</h1>
  <p class="sub">اختر صوتًا أو امزج عدة أصوات — تعمل بشكل مستمر بلا انقطاع</p>
  <div class="top">
    <button id="play">▶ تشغيل</button>
    <label>الصوت العام <input id="master" type="range" min="0" max="1" step="0.01" value="0.8" style="width:120px;vertical-align:middle"></label>
    <select id="preset">
      <option value="">مزيج جاهز…</option>
      <option value="rain:.7,thunder:.3">عاصفة ممطرة</option>
      <option value="waves:.8,wind:.2,birds:.2">شاطئ البحر</option>
      <option value="stream:.6,birds:.5,wind:.2">غابة الصباح</option>
      <option value="fire:.7,night:.4,wind:.2">ليلة المخيم</option>
      <option value="white:.5">ضوضاء بيضاء</option>
      <option value="brown:.6">ضوضاء بنية</option>
    </select>
    <select id="timer" class="timer">
      <option value="0">بدون مؤقت</option>
      <option value="25">٢٥ دقيقة (بومودورو)</option>
      <option value="45">٤٥ دقيقة</option>
      <option value="60">ساعة</option>
      <option value="120">ساعتان</option>
    </select>
    <span id="left"></span>
  </div>
  <div class="window"><span class="wlabel" id="wlabel"></span><canvas id="scene" width="960" height="600"></canvas><div class="sill"></div></div>
  <div class="grid" id="grid"></div>
  <footer>جميع الأصوات مولّدة داخل المتصفح بواسطة Web Audio — لا تحتاج إنترنت بعد التحميل.</footer>
</main>
<script>
const SOUNDS = [
  {id:'rain',   name:'مطر',          ico:'🌧️', bg:'linear-gradient(135deg,#1c2b3a,#34495e,#2c3e50,#1a252f)', fx:'rain'},
  {id:'thunder',name:'رعد',          ico:'⛈️', bg:'linear-gradient(135deg,#0f0f1e,#2b2d42,#1b1b2f,#3a3f5c)', fx:'rain'},
  {id:'waves',  name:'أمواج البحر',  ico:'🌊', bg:'linear-gradient(135deg,#0b3d5c,#1f7a8c,#0e5e6f,#3fa7b5)', fx:'bubbles'},
  {id:'wind',   name:'رياح',         ico:'🍃', bg:'linear-gradient(135deg,#5b6d5b,#8fa98f,#4a5a4a,#a3b18a)', fx:'leaves'},
  {id:'stream', name:'جدول ماء',     ico:'💧', bg:'linear-gradient(135deg,#134e3a,#2d8a6a,#1b5e4a,#56ab91)', fx:'bubbles'},
  {id:'birds',  name:'عصافير',       ico:'🐦', bg:'linear-gradient(135deg,#2e5e3e,#6a9955,#a7c957,#386641)', fx:'leaves'},
  {id:'fire',   name:'نار المخيم',   ico:'🔥', bg:'linear-gradient(135deg,#2b0f06,#7f2a0a,#c0511a,#401505)', fx:'embers'},
  {id:'night',  name:'ليل وصراصير',  ico:'🌙', bg:'linear-gradient(135deg,#050a1f,#101b3d,#1c2757,#0a0f2a)', fx:'stars'},
  {id:'white',  name:'ضوضاء بيضاء',  ico:'⚪', bg:'linear-gradient(135deg,#3a3a3a,#5c5c5c,#2e2e2e,#707070)', fx:'stars'},
  {id:'brown',  name:'ضوضاء بنية',   ico:'🟤', bg:'linear-gradient(135deg,#2a1d14,#4e3629,#3b2a1f,#6b4f3a)', fx:'stars'},
];
let ctx, master, playing=false, lastFx='stars';
const state = {}; // id -> {vol, gain, built}

function noiseBuffer(type){
  const len = ctx.sampleRate*4, buf = ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){
    const d=buf.getChannelData(c); let last=0,b0=0,b1=0,b2=0;
    for(let i=0;i<len;i++){
      const w=Math.random()*2-1;
      if(type==='brown'){ last=(last+0.02*w)/1.02; d[i]=last*3.5; }
      else if(type==='pink'){ b0=0.997*b0+w*0.029591; b1=0.985*b1+w*0.032534; b2=0.95*b2+w*0.048056; d[i]=(b0+b1+b2+w*0.05)*1.2; }
      else d[i]=w;
    }
  }
  return buf;
}
const bufs={};
function src(type){ const s=ctx.createBufferSource(); s.buffer=bufs[type]||(bufs[type]=noiseBuffer(type)); s.loop=true; s.start(); return s; }
function filt(type,f,q=1){ const b=ctx.createBiquadFilter(); b.type=type; b.frequency.value=f; b.Q.value=q; return b; }
function lfo(freq,amount,target,offset){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=freq; g.gain.value=amount; o.connect(g).connect(target); if(offset!==undefined) target.value=offset; o.start(); }

const BUILDERS = {
  white(out){ src('white').connect(filt('lowpass',9000)).connect(scale(.35,out)); },
  brown(out){ src('brown').connect(scale(1,out)); },
  rain(out){
    src('pink').connect(filt('highpass',400)).connect(filt('lowpass',7000)).connect(scale(.9,out));
    // droplets
    const drop=()=>{ if(!ctx) return; const t=ctx.currentTime; const o=ctx.createOscillator(), g=ctx.createGain();
      o.frequency.setValueAtTime(1500+Math.random()*3000,t); o.frequency.exponentialRampToValueAtTime(400,t+.03);
      g.gain.setValueAtTime(.04*Math.random(),t); g.gain.exponentialRampToValueAtTime(.0001,t+.04);
      o.connect(g).connect(out); o.start(t); o.stop(t+.05); setTimeout(drop,20+Math.random()*80); };
    drop();
  },
  thunder(out){
    const rumble=()=>{ const t=ctx.currentTime, s=ctx.createBufferSource(); s.buffer=bufs.brown||(bufs.brown=noiseBuffer('brown'));
      const g=ctx.createGain(), f=filt('lowpass',180+Math.random()*200); g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(1.6,t+.3+Math.random()); g.gain.exponentialRampToValueAtTime(.001,t+6+Math.random()*4);
      s.connect(f).connect(g).connect(out); s.start(t,Math.random()*3); s.stop(t+11);
      if(state.thunder?.vol>0 && playing) flash(); setTimeout(rumble,8000+Math.random()*15000); };
    const g=scale(.25,out); src('brown').connect(filt('lowpass',120)).connect(g); setTimeout(rumble,1500);
  },
  waves(out){
    const g=ctx.createGain(); g.gain.value=0; src('pink').connect(filt('lowpass',1200)).connect(g).connect(out);
    lfo(0.09,.45,g.gain,.55);
  },
  wind(out){
    const f=filt('bandpass',500,.8), g=ctx.createGain(); src('pink').connect(f).connect(g).connect(scale(1.4,out));
    lfo(0.05,300,f.frequency,550); lfo(0.13,.35,g.gain,.65);
  },
  stream(out){
    const f=filt('bandpass',1800,.6); src('white').connect(f).connect(scale(.4,out)); lfo(0.7,500,f.frequency,1800);
    const f2=filt('bandpass',900,2); src('pink').connect(f2).connect(scale(.5,out)); lfo(1.3,300,f2.frequency,900);
  },
  birds(out){
    const chirp=()=>{ const t=ctx.currentTime, n=2+Math.floor(Math.random()*5), base=2200+Math.random()*2500;
      for(let i=0;i<n;i++){ const o=ctx.createOscillator(), g=ctx.createGain(), s=t+i*.12;
        o.frequency.setValueAtTime(base,s); o.frequency.exponentialRampToValueAtTime(base*(Math.random()>.5?1.5:.7),s+.08);
        g.gain.setValueAtTime(0,s); g.gain.linearRampToValueAtTime(.08,s+.01); g.gain.exponentialRampToValueAtTime(.0001,s+.1);
        o.connect(g).connect(out); o.start(s); o.stop(s+.12); }
      setTimeout(chirp,600+Math.random()*3500); };
    chirp();
  },
  fire(out){
    src('brown').connect(filt('lowpass',600)).connect(scale(.6,out));
    const crackle=()=>{ const t=ctx.currentTime, s=ctx.createBufferSource(); s.buffer=bufs.white||(bufs.white=noiseBuffer('white'));
      const g=ctx.createGain(), f=filt('highpass',1000+Math.random()*3000); g.gain.setValueAtTime(.3+Math.random()*.6,t); g.gain.exponentialRampToValueAtTime(.001,t+.01+Math.random()*.03);
      s.connect(f).connect(g).connect(out); s.start(t,Math.random()*3); s.stop(t+.05); setTimeout(crackle,15+Math.random()*(Math.random()>.8?400:90)); };
    crackle();
  },
  night(out){
    const o=ctx.createOscillator(), g=ctx.createGain(), am=ctx.createGain(); o.frequency.value=4400; o.type='triangle';
    g.gain.value=0; o.connect(g).connect(am).connect(out); lfo(28,.04,g.gain,.04); am.gain.value=0; lfo(0.4,.5,am.gain,.5); o.start();
    src('pink').connect(filt('lowpass',400)).connect(scale(.25,out));
  },
};
function scale(v,out){ const g=ctx.createGain(); g.gain.value=v; g.connect(out); return g; }

function ensure(id){
  const s=state[id]; if(s.built) return; s.built=true;
  s.gain=ctx.createGain(); s.gain.gain.value=0; s.gain.connect(master); BUILDERS[id](s.gain);
}
function apply(id){
  const s=state[id]; if(!ctx) return; if(s.vol>0) ensure(id);
  if(s.gain) s.gain.gain.setTargetAtTime(s.vol, ctx.currentTime, .4);
}
function initAudio(){
  if(ctx) return; ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain(); master.gain.value=+document.getElementById('master').value;
  const comp=ctx.createDynamicsCompressor(); master.connect(comp).connect(ctx.destination);
}

// UI
const grid=document.getElementById('grid');
SOUNDS.forEach(s=>{
  state[s.id]={vol:0};
  const el=document.createElement('div'); el.className='card'; el.id='c-'+s.id;
  el.innerHTML=`<div class="ico">${s.ico}</div><div class="name">${s.name}</div><input type="range" min="0" max="1" step="0.01" value="0">`;
  const r=el.querySelector('input');
  r.addEventListener('click',e=>e.stopPropagation());
  r.addEventListener('input',()=>setVol(s.id,+r.value));
  el.addEventListener('click',()=>setVol(s.id, state[s.id].vol>0?0:.6));
  grid.appendChild(el);
});
function setVol(id,v){
  state[id].vol=v; const el=document.getElementById('c-'+id); el.querySelector('input').value=v; el.classList.toggle('on',v>0);
  if(v>0){ const s=SOUNDS.find(x=>x.id===id); document.getElementById('bg').style.background=s.bg; lastFx=s.fx; setScene(id); if(!playing) start(); }
  apply(id); save();
}
function start(){ initAudio(); ctx.resume(); playing=true; document.getElementById('play').textContent='⏸ إيقاف';
  if(!SOUNDS.some(s=>state[s.id].vol>0)) setVol('rain',.6); SOUNDS.forEach(s=>apply(s.id)); startTimer(); }
function stop(){ if(ctx) ctx.suspend(); playing=false; document.getElementById('play').textContent='▶ تشغيل'; clearInterval(tInt); document.getElementById('left').textContent=''; }
document.getElementById('play').onclick=()=>playing?stop():start();
document.getElementById('master').oninput=e=>{ if(master) master.gain.setTargetAtTime(+e.target.value,ctx.currentTime,.1); };
document.getElementById('preset').onchange=e=>{ if(!e.target.value) return; SOUNDS.forEach(s=>setVol(s.id,0));
  e.target.value.split(',').forEach(p=>{const [id,v]=p.split(':'); setVol(id,+v);}); e.target.value=''; };
let tInt, tEnd=0;
function startTimer(){ clearInterval(tInt); const m=+document.getElementById('timer').value; const L=document.getElementById('left');
  if(!m||!playing){ L.textContent=''; return; } tEnd=Date.now()+m*60000;
  tInt=setInterval(()=>{ const r=tEnd-Date.now(); if(r<=0){ stop(); return; } L.textContent=`⏳ ${Math.floor(r/60000)}:${String(Math.floor(r/1000)%60).padStart(2,'0')}`; },1000); }
document.getElementById('timer').onchange=startTimer;
document.addEventListener('keydown',e=>{ if(e.code==='Space'&&e.target.tagName!=='INPUT'){ e.preventDefault(); playing?stop():start(); } });
function save(){ try{ localStorage.setItem('nature-mix',JSON.stringify(Object.fromEntries(SOUNDS.map(s=>[s.id,state[s.id].vol])))); }catch(e){} }
try{ const m=JSON.parse(localStorage.getItem('nature-mix')||'{}'); for(const k in m) if(state[k]&&m[k]>0){ state[k].vol=m[k]; const el=document.getElementById('c-'+k); el.querySelector('input').value=m[k]; el.classList.add('on'); document.getElementById('bg').style.background=SOUNDS.find(s=>s.id===k).bg; lastFx=SOUNDS.find(s=>s.id===k).fx; sceneId=k; } }catch(e){}
if(!document.getElementById('bg').style.background) document.getElementById('bg').style.background=SOUNDS[4].bg;

// Visual particles
const cv=document.getElementById('fx'), g2=cv.getContext('2d'); let W,H,parts=[], flashA=0;
function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } addEventListener('resize',resize); resize();
function flash(){ flashA=.6; }
function spawn(){ const t=lastFx, p={x:Math.random()*W,y:t==='embers'||t==='bubbles'?H+10:-10,t};
  if(t==='rain'){ p.vy=12+Math.random()*8; p.vx=-1; p.l=10+Math.random()*10; }
  else if(t==='embers'){ p.vy=-(1+Math.random()*2); p.vx=Math.random()-.5; p.r=1+Math.random()*2; }
  else if(t==='bubbles'){ p.vy=-(.5+Math.random()); p.vx=Math.random()-.5; p.r=2+Math.random()*5; }
  else if(t==='leaves'){ p.vy=1+Math.random(); p.vx=1+Math.random()*2; p.r=3+Math.random()*3; p.x=Math.random()*W-100; }
  else { p.y=Math.random()*H; p.vy=0; p.vx=0; p.r=Math.random()*1.5; p.life=200; p.tw=Math.random()*6; }
  parts.push(p); }
function frame(){
  g2.clearRect(0,0,W,H); const target=lastFx==='rain'?220:lastFx==='stars'?120:60;
  if(parts.length<target) for(let i=0;i<4;i++) spawn();
  parts=parts.filter(p=>{ p.x+=p.vx; p.y+=p.vy;
    if(p.t==='rain'){ g2.strokeStyle='rgba(200,220,255,.35)'; g2.beginPath(); g2.moveTo(p.x,p.y); g2.lineTo(p.x+p.vx*2,p.y+p.l); g2.stroke(); }
    else if(p.t==='embers'){ g2.fillStyle=`rgba(255,${120+Math.random()*80|0},40,.8)`; g2.beginPath(); g2.arc(p.x,p.y,p.r,0,7); g2.fill(); }
    else if(p.t==='bubbles'){ g2.strokeStyle='rgba(255,255,255,.3)'; g2.beginPath(); g2.arc(p.x,p.y,p.r,0,7); g2.stroke(); }
    else if(p.t==='leaves'){ g2.fillStyle='rgba(180,220,140,.45)'; g2.beginPath(); g2.ellipse(p.x,p.y,p.r*2,p.r,p.x/40,0,7); g2.fill(); }
    else { p.tw+=.05; p.life--; g2.fillStyle=`rgba(255,255,255,${.3+.3*Math.sin(p.tw)})`; g2.beginPath(); g2.arc(p.x,p.y,p.r,0,7); g2.fill(); return p.life>0; }
    return p.y<H+30&&p.y>-30&&p.x<W+120&&p.t===lastFx; });
  if(flashA>0){ g2.fillStyle=`rgba(230,235,255,${flashA})`; g2.fillRect(0,0,W,H); flashA-=.04; }
  requestAnimationFrame(frame);
}
frame();
// Window scene: a painted nature view that follows the selected sound
const sc=document.getElementById('scene'), S=sc.getContext('2d'), SW=960, SH=600;
let sceneId='stream', st=0, flashS=0;
function setScene(id){ sceneId=id; document.getElementById('wlabel').textContent=SOUNDS.find(s=>s.id===id).ico+' '+SOUNDS.find(s=>s.id===id).name; }
const rnd=(a,b)=>a+Math.random()*(b-a);
const STARS=[...Array(140)].map(()=>[rnd(0,SW),rnd(0,SH*.6),rnd(.5,1.8),rnd(0,6)]);
const DROPS=[...Array(260)].map(()=>[rnd(0,SW),rnd(0,SH),rnd(14,24)]);
const GLASS=[...Array(40)].map(()=>[rnd(0,SW),rnd(0,SH),rnd(3,8),rnd(.2,1.2)]);
const FLIES=[...Array(25)].map(()=>[rnd(0,SW),rnd(SH*.5,SH),rnd(0,6)]);
const GRASS=[...Array(220)].map(()=>[rnd(0,SW),rnd(30,80),rnd(0,6)]);
const BIRDS=[...Array(7)].map(()=>[rnd(-SW,SW),rnd(60,260),rnd(.8,1.6),rnd(0,6)]);
const TREES=[...Array(14)].map((_,i)=>[i*75+rnd(-20,20),rnd(120,200)]);
function sky(a,b){ const g=S.createLinearGradient(0,0,0,SH); g.addColorStop(0,a); g.addColorStop(1,b); S.fillStyle=g; S.fillRect(0,0,SW,SH); }
function hills(y,amp,col,seed){ S.fillStyle=col; S.beginPath(); S.moveTo(0,SH); for(let x=0;x<=SW;x+=20) S.lineTo(x,y+Math.sin(x/140+seed)*amp+Math.sin(x/53+seed*2)*amp*.3); S.lineTo(SW,SH); S.fill(); }
function pine(x,base,h,col){ S.fillStyle=col; S.beginPath(); S.moveTo(x,base-h); S.lineTo(x-h*.28,base); S.lineTo(x+h*.28,base); S.fill(); }
function circle(x,y,r,c){ S.fillStyle=c; S.beginPath(); S.arc(x,y,r,0,7); S.fill(); }
function stars(a){ STARS.forEach(s=>{ S.globalAlpha=a*(.5+.5*Math.sin(st*2+s[3])); circle(s[0],s[1],s[2],'#fff'); }); S.globalAlpha=1; }
function rainFall(c){ S.strokeStyle=c; S.lineWidth=1.3; S.beginPath(); DROPS.forEach(d=>{ d[1]+=d[2]; d[0]-=2; if(d[1]>SH){d[1]=-20;d[0]=rnd(0,SW+100);} S.moveTo(d[0],d[1]); S.lineTo(d[0]-3,d[1]+d[2]); }); S.stroke(); }
function glass(){ GLASS.forEach(g=>{ g[1]+=g[3]; if(g[1]>SH){g[1]=-10;g[0]=rnd(0,SW);} circle(g[0],g[1],g[2],'rgba(200,220,255,.18)'); circle(g[0]-g[2]*.3,g[1]-g[2]*.3,g[2]*.3,'rgba(255,255,255,.35)'); }); }
const SCENES={
  rain(){ sky('#3b4654','#6b7785'); hills(360,30,'#48535c',1); hills(420,25,'#343e45',3); TREES.forEach(t=>pine(t[0],470,t[1]*.8,'#232b30')); S.fillStyle='#1f262a'; S.fillRect(0,470,SW,SH); rainFall('rgba(210,225,240,.45)'); glass(); },
  thunder(){ sky('#11131d','#2c3040'); hills(380,30,'#1c2029',2); TREES.forEach(t=>pine(t[0],480,t[1]*.8,'#0e1116')); S.fillStyle='#0b0d12'; S.fillRect(0,480,SW,SH);
    if(Math.random()<.004) flashS=1; if(flashS>0){ S.strokeStyle=`rgba(230,235,255,${flashS})`; S.lineWidth=3; S.beginPath(); let x=rnd(200,760),y=0; S.moveTo(x,y); while(y<380){ x+=rnd(-40,40); y+=rnd(30,60); S.lineTo(x,y);} S.stroke(); S.fillStyle=`rgba(220,225,255,${flashS*.4})`; S.fillRect(0,0,SW,SH); flashS-=.06; }
    rainFall('rgba(200,210,235,.4)'); glass(); },
  waves(){ sky('#7fc8e8','#f6e2b8'); circle(720,170,55,'#fff3c4'); S.globalAlpha=.25; circle(720,170,90,'#fff3c4'); S.globalAlpha=1;
    for(let i=0;i<6;i++){ const y=300+i*40; S.fillStyle=`hsl(195,${60-i*4}%,${45-i*4}%)`; S.beginPath(); S.moveTo(0,SH); for(let x=0;x<=SW;x+=10) S.lineTo(x,y+Math.sin(x/60+st*(1+i*.3)+i)*(4+i*2)); S.lineTo(SW,SH); S.fill(); }
    const sh=520+Math.sin(st*.6)*25; S.fillStyle='#e9d3a1'; S.beginPath(); S.moveTo(0,SH); for(let x=0;x<=SW;x+=20) S.lineTo(x,sh+Math.sin(x/90)*10); S.lineTo(SW,SH); S.fill();
    S.strokeStyle='rgba(255,255,255,.8)'; S.lineWidth=3; S.beginPath(); for(let x=0;x<=SW;x+=20) S.lineTo(x,sh+Math.sin(x/90)*10); S.stroke(); },
  wind(){ sky('#9cc3d8','#dfe9d0'); [[200,90],[600,130],[850,70]].forEach(([x,y],i)=>{ const cx=(x+st*20*(i+1))%(SW+300)-150; [0,40,80].forEach(o=>circle(cx+o,y+(o==40?-15:0),35,'rgba(255,255,255,.85)')); });
    hills(360,40,'#8fae6b',1); hills(420,30,'#6f9150',4); S.strokeStyle='#557a38'; S.lineWidth=2; S.beginPath();
    GRASS.forEach(g=>{ const b=Math.sin(st*1.8+g[0]/80)*18; S.moveTo(g[0],SH); S.quadraticCurveTo(g[0]+b*.4,SH-g[1]*.6,g[0]+b,SH-g[1]); }); S.stroke(); },
  stream(){ sky('#a8d5c2','#e8f1d8'); hills(300,30,'#4f7d5a',2); TREES.forEach(t=>pine(t[0],380,t[1],'#2f5a3e')); S.fillStyle='#4c7a3c'; S.fillRect(0,380,SW,SH);
    S.fillStyle='#4f9fb8'; S.beginPath(); S.moveTo(420,380); S.bezierCurveTo(380,450,600,500,300,SH); S.lineTo(700,SH); S.bezierCurveTo(820,500,520,450,540,380); S.fill();
    S.strokeStyle='rgba(255,255,255,.55)'; S.lineWidth=2; for(let i=0;i<14;i++){ const t=((st*.25+i/14)%1), y=380+t*220, x=480+Math.sin(t*5+i)*(40+t*120); S.beginPath(); S.moveTo(x-10-t*20,y); S.lineTo(x+10+t*20,y); S.stroke(); }
    [[250,520,30],[720,540,40],[640,470,18]].forEach(r=>{ S.fillStyle='#7d8580'; S.beginPath(); S.ellipse(r[0],r[1],r[2]*1.4,r[2],0,0,7); S.fill(); }); },
  birds(){ sky('#f9c78a','#fde9c8'); circle(250,330,70,'#ffdf9e'); hills(330,35,'#9bb56b',0); hills(400,30,'#6f9147',2);
    [[120,400],[830,420]].forEach(([x,b])=>{ S.fillStyle='#5b3d24'; S.fillRect(x-8,b-120,16,120); circle(x,b-150,70,'#4d7a34'); circle(x-45,b-120,50,'#58883b'); circle(x+45,b-120,50,'#58883b'); });
    S.strokeStyle='#3a2a20'; S.lineWidth=2.5; BIRDS.forEach(b=>{ b[0]+=b[2]; if(b[0]>SW+40){b[0]=-40;b[1]=rnd(60,260);} const f=Math.sin(st*8+b[3])*8; S.beginPath(); S.moveTo(b[0]-14,b[1]-f); S.quadraticCurveTo(b[0]-6,b[1]-6,b[0],b[1]); S.quadraticCurveTo(b[0]+6,b[1]-6,b[0]+14,b[1]-f); S.stroke(); }); },
  fire(){ sky('#0a0c1c','#241a2a'); stars(.8); TREES.forEach(t=>pine(t[0],430,t[1]*1.1,'#070810')); S.fillStyle='#120d0c'; S.fillRect(0,430,SW,SH);
    const cx=300,cy=500, g=S.createRadialGradient(cx,cy,10,cx,cy,300); g.addColorStop(0,'rgba(255,140,40,.45)'); g.addColorStop(1,'rgba(255,100,20,0)'); S.fillStyle=g; S.fillRect(0,0,SW,SH);
    S.fillStyle='#3a2415'; S.save(); S.translate(cx,cy+20); [-.35,.35].forEach(a=>{ S.save(); S.rotate(a); S.fillRect(-80,-9,160,18); S.restore(); }); S.restore();
    for(let i=0;i<5;i++){ const h=90+Math.sin(st*7+i*2)*25, w=26+i*4; S.fillStyle=['#ffcf4a','#ff9a2e','#ff6a1a','#e8431a','#ffe08a'][i]; S.globalAlpha=.75; S.beginPath(); S.moveTo(cx-w,cy+10); S.quadraticCurveTo(cx-w*.6+Math.sin(st*5+i)*8,cy-h*.6,cx+Math.sin(st*6+i)*10,cy-h); S.quadraticCurveTo(cx+w*.6,cy-h*.5,cx+w,cy+10); S.fill(); } S.globalAlpha=1;
    FLIES.slice(0,12).forEach((e,i)=>{ const t=(st*.4+i/12)%1; circle(cx+Math.sin(t*9+i)*30,cy-40-t*260,2*(1-t)+.5,`rgba(255,170,60,${1-t})`); }); },
  night(){ sky('#050a24','#18264f'); stars(1); circle(740,130,45,'#f4f1dc'); circle(760,120,45,'#050a24'); hills(380,30,'#0c1430',1); TREES.forEach(t=>pine(t[0],460,t[1],'#060b1c')); S.fillStyle='#070c1d'; S.fillRect(0,460,SW,SH);
    FLIES.forEach(f=>{ const x=f[0]+Math.sin(st*.7+f[2])*30, y=f[1]+Math.cos(st*.5+f[2])*20, a=.5+.5*Math.sin(st*3+f[2]); circle(x,y,6,`rgba(210,255,120,${a*.25})`); circle(x,y,2,`rgba(230,255,160,${a})`); }); },
  white(){ const g=S.createLinearGradient(0,0,SW,SH); g.addColorStop(0,'#cfd6dc'); g.addColorStop(1,'#8b959e'); S.fillStyle=g; S.fillRect(0,0,SW,SH);
    for(let i=0;i<5;i++){ S.fillStyle='rgba(255,255,255,.18)'; S.beginPath(); S.ellipse((i*260+st*15)%(SW+400)-200,150+i*90,260,50,0,0,7); S.fill(); } hills(470,20,'rgba(90,100,110,.5)',2); },
  brown(){ sky('#8a6a4c','#3d2b1e'); for(let i=0;i<4;i++) hills(300+i*70,30-i*4,`hsl(28,${30+i*5}%,${38-i*7}%)`,i*1.7); circle(480,260,60,'rgba(255,220,170,.35)'); },
};
function drawScene(){ st+=1/60; (SCENES[sceneId]||SCENES.stream)(); S.fillStyle='rgba(255,255,255,.05)'; S.beginPath(); S.moveTo(0,0); S.lineTo(SW*.35,0); S.lineTo(0,SH*.5); S.fill(); requestAnimationFrame(drawScene); }
setScene(sceneId); drawScene();

</script>
